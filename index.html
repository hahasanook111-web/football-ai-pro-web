<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071426">
<title>FOOTBALL AI PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:#fff;font-family:Arial,sans-serif}
header{background:linear-gradient(120deg,#102e50,#087c70);padding:24px 16px;text-align:center}
header h1{margin:0;color:#55f2bd;font-size:27px}
header p{margin:8px 0 0;color:#d6e9f5}
main{max-width:850px;margin:auto;padding:16px}
.panel{background:#10243b;border:1px solid #24415c;border-radius:14px;padding:15px;margin-bottom:15px}
.controls{display:flex;gap:10px;flex-wrap:wrap}
input,button{padding:12px;border-radius:9px;border:1px solid #35536c;font-size:15px}
input{background:#071426;color:white;flex:1;min-width:150px}
button{background:#10b981;color:#041b18;font-weight:bold;cursor:pointer}
.status{color:#a8c5d9;font-size:14px;margin-top:10px}
.match{background:#10243b;border:1px solid #24415c;border-radius:13px;padding:15px;margin:12px 0}
.league{color:#55f2bd;font-size:13px;margin-bottom:12px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.team{font-weight:bold;overflow-wrap:anywhere}
.team img{width:38px;height:38px;object-fit:contain;display:block;margin:0 auto 7px}
.score{font-size:21px;font-weight:bold;color:#55f2bd;white-space:nowrap}
.meta{color:#a8c5d9;font-size:13px;text-align:center;margin-top:12px}
.analysis{border-top:1px solid #29445d;margin-top:12px;padding-top:12px;color:#d6e9f5;font-size:14px;line-height:1.6}
.empty{text-align:center;color:#b7ccdc;padding:28px 10px}
footer{text-align:center;color:#7894aa;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
<h1>⚽ FOOTBALL AI PRO</h1>
<p>ระบบติดตามและวิเคราะห์ฟุตบอล</p>
</header>
<main>
<div class="panel">
<h3>📅 โปรแกรมการแข่งขัน</h3>
<div class="controls">
<input type="date" id="matchDate">
<button onclick="loadMatches()">ค้นหาบอล</button>
</div>
<div class="status" id="status">กำลังเตรียมระบบ...</div>
</div>
<div class="panel">
<strong>🌍 รายการแข่งขันทั่วโลก</strong>
<div class="status">ข้อมูลการแข่งขันจาก API-Football ผ่าน Backend</div>
</div>
<div id="matches"></div>
</main>
<footer>FOOTBALL AI PRO · ข้อมูลเพื่อประกอบการติดตามกีฬา</footer>
<script>
const API="https://football-ai-pro-backend.onrender.com";
const dateInput=document.getElementById("matchDate");
const statusBox=document.getElementById("status");
const matchesBox=document.getElementById("matches");

function localDate(){
 const d=new Date();
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,"0");
 const day=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${day}`;
}
dateInput.value=localDate();

function safe(value){
 return String(value??"-").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function getMatches(data){
 if(Array.isArray(data)) return data;
 if(Array.isArray(data?.response)) return data.response;
 if(Array.isArray(data?.data?.response)) return data.data.response;
 if(Array.isArray(data?.data)) return data.data;
 if(Array.isArray(data?.fixtures)) return data.fixtures;
 return null;
}
function matchTime(item){
 const date=item?.fixture?.date||item?.date;
 if(!date)return "-";
 return new Date(date).toLocaleTimeString("th-TH",{
 hour:"2-digit",minute:"2-digit",timeZone:"Asia/Bangkok"
 })+" น.";
}
function renderMatch(item){
 const fixture=item.fixture||item;
 const league=item.league||{};
 const teams=item.teams||{};
 const home=teams.home||item.home||{};
 const away=teams.away||item.away||{};
 const goals=item.goals||{};
 const status=fixture.status?.long||fixture.status?.short||"รอแข่งขัน";
 const elapsed=fixture.status?.elapsed;
 const finished=["FT","AET","PEN"].includes(fixture.status?.short);
 const score=goals.home!=null&&goals.away!=null
 ? `${goals.home} - ${goals.away}` : "VS";
 const homeLogo=home.logo?`<img src="${safe(home.logo)}" alt="">`:"";
 const awayLogo=away.logo?`<img src="${safe(away.logo)}" alt="">`:"";
 const leagueName=league.name||"รายการแข่งขัน";
 const country=league.country||"";
 const homeName=home.name||"ทีมเจ้าบ้าน";
 const awayName=away.name||"ทีมเยือน";
 return `
 <article class="match">
 <div class="league">🏆 ${safe(leagueName)} · ${safe(country)}</div>
 <div class="teams">
 <div class="team">${homeLogo}${safe(homeName)}</div>
 <div class="score">${safe(score)}</div>
 <div class="team">${awayLogo}${safe(awayName)}</div>
 </div>
 <div class="meta">🕒 ${safe(matchTime(item))} · ${safe(status)} ${elapsed?`(${elapsed}')`:""}</div>
 <div class="analysis">
 <b>🤖 FOOTBALL AI PRO</b><br>
 ${finished
 ? "ผลการแข่งขันสิ้นสุดแล้ว สามารถใช้ผลนี้ประกอบการติดตามสถิติได้"
 : "รอข้อมูลสถิติทีมและฟอร์มล่าสุด เพื่อประเมินโอกาสชนะ เสมอ และแพ้อย่างเหมาะสม"}
 </div>
 </article>`;
}
async function loadMatches(){
 const date=dateInput.value;
 if(!date){statusBox.textContent="กรุณาเลือกวันที่";return;}
 statusBox.textContent="กำลังโหลดข้อมูลการแข่งขัน...";
 matchesBox.innerHTML="";
 try{
 const response=await fetch(`${API}/api/fixtures?date=${encodeURIComponent(date)}`);
 if(!response.ok) throw new Error("เซิร์ฟเวอร์ตอบกลับ HTTP "+response.status);
 const data=await response.json();
 if(data.error) throw new Error(typeof data.error==="string"?data.error:JSON.stringify(data.error));
 const list=getMatches(data);
 if(!list) throw new Error("รูปแบบข้อมูลจาก Backend ไม่ตรงกับที่คาดไว้");
 statusBox.textContent=`พบการแข่งขัน ${list.length} รายการ · วันที่ ${date}`;
 if(list.length===0){
 matchesBox.innerHTML='<div class="empty">ไม่มีโปรแกรมการแข่งขันในวันที่เลือก</div>';
 return;
 }
 matchesBox.innerHTML=list.map(renderMatch).join("");
 }catch(error){
 statusBox.textContent="ไม่สามารถโหลดข้อมูลได้";
 matchesBox.innerHTML=`
 <div class="panel">
 <div class="empty">⚠️ โหลดข้อมูลไม่สำเร็จ<br><br>${safe(error.message)}
 <br><br>ลองกดค้นหาอีกครั้ง หรือตรวจสอบ Backend</div>
 </div>`;
 }
}
loadMatches();
</script>
</body>
</html>
